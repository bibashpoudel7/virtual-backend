name: Deploy Backend to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys of the same environment at once
concurrency:
  group: backend-deploy-prod
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push image
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove existing env file
        run: rm -rf .env

      - name: Create .env file from base64 secret
        run: |
          RAW_ENV="${{ secrets.PROD_ENV_FILE || secrets.PROD_ENV_BASE64 || secrets.ENV_BASE64 }}"
          if [ -n "$RAW_ENV" ]; then
            echo "$RAW_ENV" | base64 -d > .env
            echo ".env created successfully for backend production build"
          else
            echo "ERROR: Neither PROD_ENV_FILE nor PROD_ENV_BASE64 secret is set!"
            exit 1
          fi

      - name: Login to Docker Hub, Build and Push Docker Image
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/virtual-backend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/virtual-backend:latest-${{ github.sha }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/virtual-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/virtual-backend:latest-${{ github.sha }}
          docker image prune -f

      - name: Cleanup sensitive files
        run: rm -rf .env

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: SSH into the server, migrate and restart the backend
        uses: fifsky/ssh-action@master
        with:
          command: |
            set -e

            # Login to DockerHub to pull images
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S bash -c 'echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin'

            # Pull the new image
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker compose pull virtual_backend

            # Restart virtual_backend with the new image
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker compose up -d virtual_backend

            # Wait until it answers /health (up to ~60s)
            for i in $(seq 1 30); do
              if echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker compose exec -T virtual_backend wget -qO- http://localhost:5555/health >/dev/null 2>&1; then echo "backend healthy"; break; fi
              if [ "$i" = 30 ]; then echo "backend did not become healthy"; exit 1; fi
              sleep 2
            done

            # Apply pending SQL migrations
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker compose exec -T virtual_backend ./migrate

            # Removing dangling images
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker image prune -f

          host: ${{ secrets.PROD_SERVER_IP }}
          user: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          options: "-T -o StrictHostKeyChecking=no"
