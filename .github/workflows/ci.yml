name: Backend checks

on:
  pull_request:
    branches: [main, dev]
  # Reused by the deploy workflows so nothing deploys without passing checks
  workflow_call:

jobs:
  test:
    name: Vet, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -count=1

      - name: Build
        run: go build ./...
